name: tests

on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements-tools.txt
      - name: Run tests (fake transport, no YouTube traffic)
        env:
          YFK_REAL_NETWORK: '0'
        run: python -m pytest -q --ignore=tests/test_real_network.py
      - name: Audit the complete locked dependency closure
        run: python tests/audit_lock.py
      - name: Validate a fresh wheel outside the source checkout
        run: python tests/check_wheel.py
